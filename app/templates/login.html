{% extends "base.html" %}
{% block content %}
<h2>Log in</h2>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" class="card">
  <label>Username</label>
  <input name="username" autofocus>
  <label>Password</label>
  <input name="password" type="password">
  <p><button type="submit">Log in</button></p>
</form>
{% endblock %}
